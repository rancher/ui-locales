name: Validate locales

# Every translation file has to stay structurally identical to
# reference/en-us.yaml — same keys, same order, same placeholders. Until now
# that was enforced only by prose in shared/translation-rules.md and by whoever
# reviewed the PR. This runs the same checks mechanically.
#
# reference/en-us.yaml is synced from rancher/dashboard weekly and the
# translations catch up afterwards, so a translation is routinely out of step
# with it and that cannot be treated as a failure — a sync PR would go red for
# adding, removing or moving a single key. Divergence from en-us is therefore
# reported as an advisory, and only a change that leaves a translation worse
# than it found it fails the build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  validate-locales:
    name: Validate locale files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The validator compares each locale against its previous version to
          # tell "this change broke it" from "en-us has moved on", so it needs
          # the base commit to be present.
          fetch-depth: 0

      - name: Setup Node.js with yarn caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          cache: yarn
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate locale files against reference/en-us.yaml
        run: yarn validate-locales
        env:
          # List every advisory difference in the log rather than just counting
          # them, so a reviewer can see them without running anything locally.
          ADVISORIES: '1'
          # The version of each locale file to treat as "before this change".
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}

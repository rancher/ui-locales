version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw"

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/pkg/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # .github/workflows/bump-shell.yml keeps this one current.
      - dependency-name: "@rancher/shell"

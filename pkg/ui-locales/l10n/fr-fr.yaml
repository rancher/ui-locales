advancedSettings:
  setEnv: Défini par variable d'environnement
  hideShow: Masquer/afficher le paramètre
  label: Paramètres
  subtext: Les utilisateurs habituels n'auront pas besoin de modifier ces paramètres. Procédez avec précaution, des valeurs incorrectes peuvent endommager votre installation {appName}. Les paramètres qui ont été personnalisés par rapport aux valeurs par défaut sont étiquetés 'Modifié'.
  show: Afficher
  hide: Masquer
  none: Aucun
  modified: Modifié
  edit:
    moreActions: Plus d'actions pour le paramètre - { setting }
    label: Modifier le paramètre
    changeSetting: "Modifier le paramètre :"
    agentConfigBanner: 
      text: "La modification de cette valeur ne changera pas la valeur définie dans les clusters en cours d'exécution ! Pour mettre à jour un cluster en cours d'exécution, utilisez la configuration de l'agent dans les paramètres du cluster."
      cluster: Cluster
      fleet: Fleet
    trueOption: "Vrai"
    falseOption: "Faux"
    value: Valeur
    useDefault: Utiliser la valeur par défaut
    invalidJSON: JSON invalide - veuillez vérifier et corriger votre saisie avant d'enregistrer
  descriptions:
    'cacerts': "Certificats CA nécessaires pour vérifier le certificat du serveur."
    'password-min-length': 'Définit le nombre minimum de caractères requis pour un mot de passe utilisateur.'
    'cluster-defaults': 'Remplacer les valeurs RKE par défaut lors de la création de nouveaux clusters.'
    'engine-install-url': "URL d'installation de Docker Engine par défaut (pour la plupart des pilotes de nœuds)."
    'engine-iso-url': "URL d'installation du système d'exploitation par défaut (pour le pilote vSphere)."
    'engine-newest-version': "La version la plus récente de Docker prise en charge au moment de cette version. Une version de Docker qui ne satisfait pas la plage Docker prise en charge mais qui est plus récente sera marquée comme non testée."
    'engine-supported-range': "Plage Semver pour les versions Docker Engine prises en charge. Les versions qui ne satisfont pas cette plage seront marquées comme non prises en charge dans l'interface."
    'ingress-ip-domain': "Domaine DNS générique pour les noms d'hôte Ingress générés automatiquement. <ingress-name>.<namespace-name>.<ip address of ingress controller> sera ajouté au domaine."
    'server-url': "URL d'installation {appName} par défaut. Doit être en HTTPS. Tous les nœuds de votre cluster doivent pouvoir l'atteindre."
    'system-default-registry': "Registre privé pour toutes les images système Rancher. Si aucune valeur n'est spécifiée, le registre par défaut du runtime de conteneur est utilisé. Pour Docker et containerd, la valeur par défaut est `docker.io`."
    'ui-index': "Emplacement de l'index HTML pour l'interface utilisateur du gestionnaire de clusters."
    'ui-dashboard-index': "Emplacement de l'index HTML pour l'interface {appName}."
    'ui-offline-preferred': "Contrôle si les ressources de l'interface utilisateur sont servies localement par le conteneur serveur ou depuis l'URL distante définie dans les paramètres ui-index et ui-dashboard-index. L'option `Dynamique` utilisera les ressources locales dans les versions de production de {appName}."
    'ui-pl': "Nom de l'entreprise en marque blanche."
    'auth-user-info-max-age-seconds': "L'âge maximum des tokens d'authentification d'un utilisateur avant qu'une synchronisation des appartenances aux groupes soit effectuée."
    'auth-user-info-resync-cron': "Planification cron par défaut pour la resynchronisation des appartenances aux groupes du fournisseur d'authentification."
    'cluster-template-enforcement': "Les non-administrateurs seront limités au lancement de clusters via des modèles RKE préapprouvés uniquement."
    'auth-user-session-idle-ttl-minutes': "TTL d'inactivité personnalisé (en minutes) sur une session utilisateur. Durée maximale d'inactivité avant expiration de session."
    'auth-user-session-ttl-minutes': "TTL personnalisé (en minutes) sur une session utilisateur. Durée maximale d'une session quelle que soit l'activité de l'utilisateur."
    'auth-token-max-ttl-minutes': "TTL maximum (en minutes) pour tous les tokens sauf ceux contrôlés par les paramètres de session utilisateur. Lorsque défini à 0, le token n'expire jamais."
    'kubeconfig-generate-token': "Générer automatiquement des tokens pour les utilisateurs lorsqu'un kubeconfig est demandé."
    'kubeconfig-default-token-ttl-minutes': 'TTL (in minutes) applied on all kubeconfig tokens. When set to 0, the token never expires.'
    'rke-metadata-config': 'Configurer les paramètres de rafraîchissement des métadonnées RKE.'
    'ui-banners': 'Classification banner is used to display a custom fixed banner in the header, footer, or both.'
    'custom-notifications': Modifier les notifications personnalisées
    'ui-consent-banner': 'Banner is used to display a custom consent banner presented to users during login.'
    'ui-default-landing': 'La page par défaut sur laquelle les utilisateurs arrivent après la connexion.'
    'brand': "Nom du dossier pour un thème alternatif défini dans '/assets/brand'"
    'hide-local-cluster': Masquer le cluster local
    'agent-tls-mode': "Rancher Certificate Verification. In `strict` mode the agents (system, cluster, fleet, etc) will only trust Rancher installations which are using a certificate signed by the CABundle in the `cacerts` setting. When the mode is system-store, the agents will trust any certificate signed by a CABundle in the operating system’s trust store."
    'k3s-based-upgrader-uninstall-concurrency': Defines the maximum number of clusters in which Rancher can concurrently uninstall the legacy `rancher-k3s-upgrader` or `rancher-rke2-upgrader` app from imported or node-driver K3s or RKE2 clusters.
    'system-agent-upgrader-install-concurrency': Defines the maximum number of clusters in which Rancher can concurrently install the resources required for upgrading system-agent.
    'imported-cluster-version-management': Enables version management for imported RKE2/K3s clusters, and the local cluster if it is an RKE2/K3s cluster. The per-cluster version management setting overrides this global setting at the cluster level. For existing clusters where the cluster-level version management is set to 'system-default', changing this flag will trigger a redeployment of the cluster agent during the next reconciliation (by default every 5 minutes, or as soon as the cluster is edited, whichever comes first).
  warnings:
    'agent-tls-mode': 'La modification de ce paramètre entraînera le redéploiement de tous les agents.'
  editHelp:

performance:
  label: Paramètres de performance UI
  settingName: Performance
  deprecatedInactivitySetting: "Le paramètre <i class=\"mr-5\">\"Inactivité\"</i> est désormais déprécié en faveur du <i class=\"mr-5\">auth-user-session-idle-ttl-minutes</i>&nbsp;<a href=\"{settingsPageUrl}\">Paramètre</a>."
  deprecatedForSSP: "Le paramètre <i class=\"mr-5\">\"{setting}\"</i> est désormais déprécié et sera supprimé dans une prochaine version."
  incrementalLoad:
    label: Chargement incrémentiel
    setting: Vous pouvez configurer le seuil au-dessus duquel le chargement incrémentiel sera utilisé.
    description: |-
      Lorsqu'activé, les ressources apparaîtront plus rapidement, mais il peut prendre un peu plus de temps pour charger l'ensemble des ressources. Ce paramètre s'applique uniquement aux ressources provenant de l'API Kubernetes
    checkboxLabel: Activer le chargement incrémentiel
    inputLabel: Seuil de ressources
    incompatibleDescription: "Le chargement incrémentiel est incompatible avec le filtrage Espace de noms/Projet et la pagination côté serveur. L'activer les désactivera."
  manualRefresh:
    label: Actualisation manuelle
    setting: Vous pouvez configurer un seuil au-dessus duquel l'actualisation manuelle sera activée.
    buttonTooltip: Actualiser la liste
    description: |-
      Lorsqu'activé, les données de liste ne se mettront pas à jour automatiquement mais l'utilisateur devra déclencher manuellement une actualisation de la vue liste. Ce paramètre s'applique uniquement aux ressources provenant de l'API Kubernetes
    checkboxLabel: Activer l'actualisation manuelle des données pour les listes
    inputLabel: Seuil de ressources
    incompatibleDescription: "L'actualisation manuelle est incompatible avec le filtrage Espace de noms/Projet et la pagination côté serveur. L'activer les désactivera."
  websocketNotification:
    label: Notifications Websocket
    description: |-
      Lorsque coché, les notifications websocket n'apparaîtront pas lorsque l'interface détecte une déconnexion.
    checkboxLabel: Désactiver les notifications websocket
  gc:
    label: Collecte des ressources inutilisées
    description: L'interface met en cache les ressources Kubernetes localement pour éviter de les récupérer à nouveau. Dans certains cas, cela peut entraîner une grande quantité de données stockées dans le navigateur. Activez ce paramètre pour les supprimer périodiquement.
    checkboxLabel: Activer la collecte des ressources inutilisées
    whenRun:
      description: Mettre à jour quand la collecte s'exécute
      intervalCheckBox:
        label: Exécuter la collecte périodiquement
      interval:
        inputLabel: Exécuter toutes les
      route:
        description: Exécuter la collecte lors du changement de page
        inputLabel: Changement de page
    howRun:
      description: Mettre à jour comment la collecte s'exécute
      age:
        description: "Les types de ressources ne doivent pas avoir été accédés dans cette période pour être pris en compte pour la collecte."
        inputLabel: Âge des ressources
      count:
        description: Les types de ressources doivent dépasser cette quantité pour être pris en compte pour la collecte.
        inputLabel: Nombre de ressources
  nsFiltering:
    label: Exiger le filtrage Espace de noms / Projet
    description: Exiger que l'utilisateur sélectionne des espaces de noms et/ou des projets. Cela restreint le nombre de ressources récupérées lors de l'affichage des listes et devrait améliorer la réactivité de l'interface dans les systèmes avec beaucoup de ressources.
    checkboxLabel: Activer le filtrage Espace de noms / Projet requis
    incompatibleDescription: "Le filtrage Espace de noms / Projet requis est incompatible avec l'actualisation manuelle et le chargement incrémentiel. L'activer les désactivera."
  advancedWorker:
    label: Web Worker Websocket
    description: Les mises à jour des ressources poussées vers l'interface arrivent via WebSocket et sont gérées dans le fil UI. Activez cette option pour gérer les mises à jour WebSocket du cluster dans un Web Worker dans un fil séparé. Cela devrait améliorer la réactivité de l'interface dans les systèmes où les ressources changent souvent.
    checkboxLabel: Activer le Web Worker Websocket avancé
  inactivity:
    title: Inactivité
    checkboxLabel: Activer l'expiration de session par inactivité
    inputLabel: Inactivity timeout (minutes)
    information: To change the automatic logout behaviour, edit the authorisation and/or session token timeout values (<code>auth-user-session-ttl-minutes</code> and <code>auth-token-max-ttl-minutes</code>) in the Settings page.
    description: When enabled and the user is inactive past the specified timeout, the UI will no longer fresh page content and the user must reload the page to continue.
    authUserTTL: This timeout cannot be higher than the user session timeout auth-user-session-ttl-minutes, which is currently {current} minutes.
  serverPagination:
    label: Server-side Pagination
    description: By default Lists will fetch all resources and paginate (create the page given sort and filter settings) locally in the browser. Server-Side Pagination moves this out from the browser to the server. This improves performance of the UI, especially in systems with lots of resources.
    applicable: "Server-side pagination applies to Resource Types"
    featureFlag: Enabling/Disabling <i class="mr-5">"Server-side Pagination"</i> is now solely done so via the <i class="mr-5">ui-sql-cache</i>&nbsp;<a href="{ffUrl}">Feature Flag</a>
    resources:
      generic: most resources in the cluster's 'More Resources' section
      all: All Resources

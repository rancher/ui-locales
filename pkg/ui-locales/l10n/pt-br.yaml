### Advanced Settings
##############################

advancedSettings:
  setEnv: Definir Ambiente
  hideShow: Ocultar/Mostrar
  label: Configurações Avançadas
  subtext: Estas configurações são para uso avançado apenas. Modificar essas configurações pode causar instabilidade ou comportamento inesperado.
  show: Mostrar
  hide: Ocultar
  none: Nenhum
  modified: Modificado
  edit:
    moreActions: Mais Ações
    label: Editar Configuração
    changeSetting: "Alterar Configuração"
    agentConfigBanner: 
      text: Alterar esta configuração afetará a configuração do agente de cluster
      cluster: cluster
      fleet: fleet
    trueOption: "Verdadeiro"
    falseOption: "Falso"
    value: Valor
    useDefault: Usar Padrão
    invalidJSON: JSON inválido
  descriptions:
    'cacerts': "Certificados CA necessários para verificar o certificado do servidor."
    'password-min-length': 'Define o número mínimo de caracteres necessários para uma senha de usuário.'
    'cluster-defaults': 'Substituir padrões do RKE ao criar novos clusters.'
    'engine-install-url': 'URL de instalação padrão do Docker engine (para a maioria dos drivers de nó).'
    'engine-iso-url': 'URL de instalação padrão do SO (para o driver vSphere).'
    'engine-newest-version': 'A versão mais recente do Docker suportada no momento deste lançamento. Uma versão do Docker que não satisfaz o intervalo suportado, mas é mais recente que esta, será marcada como não testada.'
    'engine-supported-range': 'Intervalo Semver para versões suportadas do Docker engine. Versões que não satisfazem este intervalo serão marcadas como não suportadas na UI.'
    'ingress-ip-domain': 'Domínio DNS curinga para uso em nomes de host Ingress gerados automaticamente. <ingress-name>.<namespace-name>.<ip address of ingress controller> será adicionado ao domínio.'
    'server-url': 'URL padrão de instalação do {appName}. Deve ser HTTPS. Todos os nós do cluster devem conseguir alcançar este endereço.'
    'system-default-registry': 'Registro privado a ser usado para todas as Imagens de Container do Sistema Rancher. Se nenhum valor for especificado, o registro padrão do runtime de container será usado.'
    'ui-index': 'Localização do índice HTML para a UI do Cluster Manager.'
    'ui-dashboard-index': 'Localização do índice HTML para a UI do {appName}.'
    'ui-offline-preferred': 'Controla se os ativos da interface são servidos localmente pelo contêiner do servidor ou da URL remota definida nas configurações ui-index e ui-dashboard-index. A opção `Dynamic` usará ativos locais em compilações de produção do {appName}.'
    'ui-pl': 'Nome da empresa de marca privada.'
    'auth-user-info-max-age-seconds': 'A idade máxima dos tokens de autenticação de usuários antes que uma sincronização de associação de grupo do provedor de autenticação seja realizada.'
    'auth-user-info-resync-cron': 'Agendamento cron padrão para ressincronização de associações de grupos do provedor de autenticação.'
    'cluster-template-enforcement': 'Não-administradores serão restritos a criar clusters apenas via Modelos RKE pré-aprovados.'
    'auth-user-session-idle-ttl-minutes': TTL de inatividade personalizado (em minutos) em uma sessão de autenticação do usuário. Esta é a duração máxima que uma sessão pode permanecer ativa quando não há atividade do usuário no navegador. Deve ser menor que "auth-user-session-ttl-minutes". Se for maior ou igual ao TTL da sessão, o recurso de inatividade é considerado desativado.
    'auth-user-session-ttl-minutes': TTL personalizado (em minutos) em uma sessão de autenticação do usuário. Esta é a duração máxima que uma sessão pode permanecer ativa independentemente da atividade do usuário no navegador. Deve ser maior que "auth-user-session-idle-ttl-minutes".
    'auth-token-max-ttl-minutes': 'TTL máximo (em minutos) para todos os tokens, exceto os controlados por "auth-user-session-ttl-minutes". Quando definido como 0, o token nunca expira.'
    'kubeconfig-generate-token': Gerar tokens automaticamente para usuários quando um kubeconfig é solicitado.
    'kubeconfig-default-token-ttl-minutes': TTL (em minutos) aplicado em todos os tokens kubeconfig. Quando definido como 0, o token nunca expira.
    'rke-metadata-config': Configurar parâmetros de atualização de metadados do RKE.
    'ui-banners': O banner de classificação é usado para exibir um banner fixo personalizado no cabeçalho, rodapé ou em ambos.
    'custom-notifications': Editar notificações personalizadas
    'ui-consent-banner': O banner é usado para exibir um banner de consentimento personalizado apresentado aos usuários durante o login.
    'ui-default-landing': A página padrão em que os usuários chegam após o login.
    'brand': Nome da pasta para um tema alternativo definido em /assets/brand
    'hide-local-cluster': Ocultar o cluster local
    'agent-tls-mode': Verificação de Certificado do Rancher. No modo `strict`, os agentes (sistema, cluster, fleet, etc.) só confiarão em instalações do Rancher que usam um certificado assinado pelo CABundle na configuração `cacerts`. No modo system-store, os agentes confiarão em qualquer certificado assinado por um CABundle no repositório de confiança do sistema operacional.
    'k3s-based-upgrader-uninstall-concurrency': Define o número máximo de clusters nos quais o Rancher pode desinstalar simultaneamente o app legado `rancher-k3s-upgrader` ou `rancher-rke2-upgrader` de clusters K3s ou RKE2 importados ou com driver de nó.
    'system-agent-upgrader-install-concurrency': Define o número máximo de clusters nos quais o Rancher pode instalar simultaneamente os recursos necessários para atualizar o system-agent.
    'imported-cluster-version-management': Habilita o gerenciamento de versão para clusters RKE2/K3s importados e o cluster local se for um cluster RKE2/K3s. A configuração de gerenciamento de versão por cluster substitui esta configuração global. Para clusters existentes onde o gerenciamento de versão por cluster está definido como system-default, alterar este sinalizador acionará uma reimplantação do agente de cluster na próxima reconciliação.
  warnings:
    'agent-tls-mode': Alterar esta configuração fará com que todos os agentes sejam reimplantados.
  editHelp:
    'ui-banners': 'Esta configuração aceita um objeto JSON contendo 3 parâmetros raiz: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> é um objeto contendo: <code>textColor</code>, <code>background</code> e <code>text</code>, onde <code>textColor</code> e <code>background</code> são qualquer valor de cor CSS válido.'
  enum:
    'ui-default-landing':
      ember: Gerenciador de Cluster
      vue: Explorador de Cluster
    'ui-offline-preferred':
      dynamic: Dinâmico
      true: Local
      false: Remoto
    'harv-ui-source':
      auto: 'Auto'
      bundled: 'Bundled'
      external: 'External'
    'harv-log-level':
      info: Info
      debug: Debug
      trace: Trace
    'agent-tls-mode':
      strict: Estrito
      system-store: Repositório do Sistema
  provisioning:
    header: Provisionamento de Cluster

featureFlags:
  label: Flags de Funcionalidade
  title: Tem certeza?
  warning: |-
    Os sinalizadores de recursos permitem que {vendor} controle determinados recursos por meio de flags.
    Recursos desativados por padrão devem ser considerados funcionalidades experimentais.
    Alguns recursos exigem reinicialização do servidor {vendor} para alteração.
    Isso resultará em uma breve interrupção da API e da UI, mas não afetará clusters ou cargas de trabalho em execução.
  promptActivate: "Confirme que deseja ativar a flag de funcionalidade \"{flag}\""
  promptDeactivate: "Confirme que deseja desativar a flag de funcionalidade \"{flag}\""
  restartRequired: "Nota: Atualizar esta flag de funcionalidade reiniciará o {vendor}"
  restart:
    title: Aguardando Reinicialização
    wait: Isso pode levar alguns instantes

performance:
  label: Desempenho
  settingName: Configurações de Desempenho
  deprecatedInactivitySetting: Esta configuração de inatividade está obsoleta
  deprecatedForSSP: Esta configuração está obsoleta para SSP
  incrementalLoad:
    label: Carregamento Incremental
    setting: Configuração de Carregamento Incremental
    description: Carrega recursos em lotes para melhorar o desempenho em clusters com muitos recursos.
      When enabled, resources will appear more quickly, but it may take slightly longer to load the entire set of resources. This setting only applies to resources that come from the Kubernetes API
    checkboxLabel: Habilitar Carregamento Incremental
    inputLabel: Tamanho do Lote
    incompatibleDescription: "O Carregamento Incremental não é compatível com as configurações selecionadas."
  manualRefresh:
    label: Atualização Manual
    setting: Configuração de Atualização Manual
    buttonTooltip: Atualizar manualmente os dados desta página
    description: Desativa as atualizações automáticas e permite ao usuário atualizar os dados manualmente.
      When enabled, list data will not auto-update but instead the user must manually trigger a list-view refresh. This setting only applies to resources that come from the Kubernetes API
    checkboxLabel: Habilitar Atualização Manual
    inputLabel: Intervalo de Atualização
    incompatibleDescription: "A Atualização Manual não é compatível com as configurações selecionadas."
  websocketNotification:
    label: Notificação WebSocket
    description: Habilita notificações em tempo real via WebSocket para atualizações de recursos.
      When checked, websocket notifications will not appear when the UI detects a disconnection.
    checkboxLabel: Habilitar Notificações WebSocket
  gc:
    label: Coleta de Lixo de Recursos
    description: A UI armazenará recursos do Kubernetes em cache localmente para evitar buscas repetidas. Em alguns casos, isso pode levar a um grande volume de dados armazenados no navegador. Habilite esta configuração para removê-los periodicamente.
    checkboxLabel: Habilitar Coleta de Lixo
    whenRun:
      description: Atualizar quando a coleta de lixo é executada
      intervalCheckBox:
        label: Executar coleta de lixo periodicamente
      interval:
        inputLabel: Executar a cada
      route:
        description: Executar coleta de lixo na mudança de página
        inputLabel: Mudança de Página
    howRun:
      description: Atualizar como a coleta de lixo é executada
      age:
        description: "Tipos de recursos não acessados dentro deste período serão considerados para coleta de lixo."
        inputLabel: Idade do Recurso
      count:
        description: Tipos de recursos que excedem esta quantidade serão considerados para coleta de lixo.
        inputLabel: Contagem de Recursos
  nsFiltering:
    label: Exigir Filtro de Namespace/Projeto
    description: Exige que o usuário selecione namespaces e/ou projetos. Isso restringe o número de recursos buscados ao visualizar listas e deve melhorar a responsividade da UI em sistemas com muitos recursos.
    checkboxLabel: Habilitar Filtro Obrigatório de Namespace/Projeto
    incompatibleDescription: "O Filtro Obrigatório de Namespace/Projeto é incompatível com Atualização Manual e Carregamento Incremental. Habilitá-lo desabilitará essas opções."
  advancedWorker:
    label: Web Worker de WebSocket
    description: As atualizações de recursos enviadas para a UI chegam via WebSocket e são tratadas no thread da UI. Habilite esta opção para tratar atualizações de WebSocket do cluster em um Web Worker em um thread separado. Isso deve melhorar a responsividade da UI em sistemas onde os recursos mudam com frequência.
    checkboxLabel: Habilitar Web Worker WebSocket Avançado
  inactivity:
    title: Inatividade
    checkboxLabel: Habilitar expiração de sessão por inatividade
    inputLabel: Tempo limite de inatividade (minutos)
    information: 'Para alterar o comportamento de logout automático, edite os valores de timeout de autorização e/ou token de sessão (<code>auth-user-session-ttl-minutes</code> e <code>auth-token-max-ttl-minutes</code>) na página de Configurações.'

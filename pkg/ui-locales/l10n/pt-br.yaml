  targetPorts: O Serviço enviará requisições para esta porta, e os Pods selecionados devem estar escutando nesta porta.
  listeningPorts: O Serviço é exposto nesta porta.
  anyNode: Qualquer Nó
  labelsAnnotations:
    label: Rótulos e Anotações
  affinity:
    actionLabels:
      clientIp: IP do Cliente
      none: Nenhuma afinidade de sessão configurada.
    helpText: Mapear conexões para um alvo consistente com base no IP de origem.
    label: Afinidade de Sessão
    timeout:
      label: Tempo de Sessão Persistente
      placeholder: 'ex.: 10800'
  externalName:
    define: Nome Externo
    helpText: Nome Externo é destinado a especificar um nome DNS canônico. Este é um campo obrigatório. Para fixar um endereço IP, use um serviço Headless.
    label: Nome Externo
    placeholder: 'ex.: meuservico.exemplo.com'
    input:
      label: Nome DNS
  harvester:
    title: Configuração do Add-on
    ipam:
      label: IPAM
    useShareIP:
      label: Usar IP Compartilhado
    useIpam:
      label: Usar IPAM
    shareIP:
      label: LB de IP Compartilhado

  ips:
    define: Portas do Serviço
    clusterIpHelpText: O endereço IP do Cluster deve estar dentro do intervalo CIDR configurado para o servidor da API.
    external:
      label: IPs Externos
      placeholder: 'ex.: 1.1.1.1'
      protip: Lista de endereços IP para os quais os nós no cluster também aceitarão tráfego para este serviço.
    input:
      label: IP de destino
      placeholder: 'ex.: 1.1.1.1'
    label: IPs de Destino
    loadBalancer:
      label: Balanceador de Carga
    loadBalancerIp:
      label: IP do Balanceador de Carga
      placeholder: 'ex.: 192.0.xxx.xxx'
      helpText: Se você especificar um loadBalancerIP mas seu provedor de nuvem não suportar o recurso, o campo loadBalancerIP que você definiu será ignorado.
  pods:
    label: Pods
  ports:
    label: Portas
  selectors:
    helpText: ""
    label: Seletores
    matchingPods:
      description: As chaves e valores do seletor destinam-se a corresponder rótulos e valores em Pods existentes.
      matchesSome: |-
        {matched, plural,
          =0 {Matches 0 of {total, number} pods. If no selector is created, manual endpoints must be made.}
          =1 {Matches 1 of {total, number} pods: "{sample}"}
          other {Matches {matched, number} of {total, number} existing pods, including "{sample}"}
        }
  serviceTypes:
    clusterIp:
      abbrv: IP
      description: Expõe um conjunto de Pods a outros Pods dentro do cluster. Este tipo de Serviço só é acessível de dentro do cluster. Este é o tipo padrão.
      label: IP do Cluster
    externalName:
      abbrv: EN
      description: Mapeia o serviço para um nome DNS externo.
      label: Nome Externo
    headless:
      abbrv: H
      description: Serviço sem IP de cluster para controle direto de DNS.
      label: Sem Cabeça
    loadBalancer:
      abbrv: LB
      description: Expõe o serviço externamente usando o balanceador de carga do provedor de nuvem.
      label: Balanceador de Carga
    nodePort:
      abbrv: NP
      description: "Expõe o serviço na porta estática de cada nó do cluster."
      label: Porta do Nó
  typeOpts:
    label: Tipo de Serviço


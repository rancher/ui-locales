      tip: O número máximo de pods permitidos além da escala desejada em qualquer momento.
    maxUnavailable:
      label: Máximo Indisponível
      tip: O número máximo de pods que podem estar indisponíveis em qualquer momento.
    minReadySeconds:
      label: Mínimo Pronto
      tip: A duração mínima que um pod deve estar pronto sem falhas de contêineres para ser considerado disponível.
    podManagementPolicy:
      label: Política de Gerenciamento de Pod
    progressDeadlineSeconds:
      label: Prazo de Progresso
      tip: A duração mínima de espera para que um deployment progrida antes de marcá-lo como falhado.
    revisionHistoryLimit:
      label: Limite de Histórico de Revisão
      tip: O número de ReplicaSets antigos a manter para rollback.
    strategies:
      labels:
        delete: 'On Delete: Novos pods são criados apenas quando os pods antigos são excluídos manualmente.'
        recreate: 'Recreate: Matar TODOS os pods e iniciar novos pods.'
        rollingUpdate: 'Rolling Update: Criar novos pods, até o surge máximo ser atingido, antes de excluir os pods antigos. Não parar mais pods do que o máximo indisponível.'
    terminationGracePeriodSeconds:
      label: Período de Graça de Terminação
      tip: A duração que o pod precisa para terminar com sucesso.
    title: Atualização
  tabs:
    labels:
      deployment: Deployment
      pod: Pod

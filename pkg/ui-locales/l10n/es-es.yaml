  typeDescriptions:
    apps.daemonset: Los DaemonSets ejecutan exactamente un pod en cada nodo elegible. Cuando se agregan nuevos nodos al clúster, los DaemonSets se despliegan automáticamente en ellos. Recomendado para cargas de trabajo de todo el sistema o escalables verticalmente que nunca necesiten más de un pod por nodo.
    apps.deployment: Los Deployments ejecutan un número escalable de réplicas de un pod distribuidas entre los nodos elegibles. Los cambios se aplican de forma incremental y se pueden revertir a la revisión anterior cuando sea necesario. Recomendado para cargas de trabajo sin estado y escalables horizontalmente.
    apps.statefulset: Los StatefulSets administran aplicaciones con estado y proporcionan garantías sobre el ordenamiento y la unicidad de los pods creados. Recomendado para cargas de trabajo con almacenamiento persistente o requisitos estrictos de identidad, quórum u orden de actualización.
    batch.cronjob: Los CronJobs crean Jobs, que luego ejecutan Pods, según un programa repetitivo. El programa se expresa en formato Unix cron estándar y usa la zona horaria del plano de control de Kubernetes (generalmente UTC).
    batch.job: Los Jobs crean uno o más pods para realizar de forma fiable una tarea de una sola vez ejecutando un pod hasta que salga con éxito. Los pods fallidos se reemplazan automáticamente hasta que se alcanza el número especificado de ejecuciones completadas. Los Jobs también pueden ejecutar varios pods en paralelo o funcionar como una cola de trabajo por lotes.
    pod: Los Pods son las unidades de cómputo implementables más pequeñas que puede crear y administrar en Kubernetes. Un Pod es un grupo de uno o más contenedores, con recursos de almacenamiento y red compartidos, y una especificación de cómo ejecutar los contenedores.
  upgrading:
    activeDeadlineSeconds:
      label: Tiempo límite activo del Pod
      tip: La duración que el pod puede estar activo antes de que el sistema intente marcarlo como fallido y matar los contenedores asociados.
    concurrencyPolicy:
      label: Concurrencia
      options:
        allow: Permitir que los CronJobs se ejecuten concurrentemente
        forbid: Omitir la siguiente ejecución si la ejecución actual no ha terminado
        replace: Reemplazar la ejecución si la ejecución actual no ha terminado
    maxSurge:
      label: Aumento máximo
      tip: El número máximo de pods permitidos más allá de la escala deseada en cualquier momento.
    maxUnavailable:
      label: Máximo no disponible
      tip: El número máximo de pods que pueden no estar disponibles en cualquier momento.
    minReadySeconds:
      label: Mínimo listo
      tip: La duración mínima que un pod debe estar listo sin que los contenedores fallen para ser considerado disponible.
    podManagementPolicy:
      label: Directiva de administración de pods
    progressDeadlineSeconds:
      label: Plazo de progreso
      tip: La duración mínima de espera para que un despliegue progrese antes de marcarlo como fallido.
    revisionHistoryLimit:

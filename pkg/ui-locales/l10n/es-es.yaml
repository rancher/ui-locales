typeDescription:
  # Map of
  # type: Description to be shown on the top of list view describing the type.
  #       Should fit on one line.
  #       If you link to anything external, it MUST have
  #       target="_blank" rel="noopener noreferrer nofollow"
  jwt.authentication: Habilite esta función en un clúster para agregar soporte para autenticación JWT de cuentas de servicio secundarias.
  branding: "La personalización de marca permite a los administradores cambiar globalmente la UI personalizando el nombre del producto Rancher, los logotipos y el esquema de colores."
  chart: "Todos los gráficos tienen al menos una versión instalable en clústeres con nodos Linux y Windows, a menos que se indique lo contrario."
  compliance.cattle.io.clusterscanbenchmark: Una versión de benchmark es el nombre del benchmark a ejecutar usando kube-bench, así como los parámetros de configuración válidos para ese benchmark.
  compliance.cattle.io.clusterscanprofile: Un perfil es la configuración para el análisis de cumplimiento, que incluye las versiones de benchmark a usar y las pruebas específicas a omitir.
  compliance.cattle.io.clusterscan: Se crea un análisis para activar un análisis de cumplimiento en el clúster basado en el perfil definido. Se crea un informe una vez completado el análisis.
  compliance.cattle.io.clusterscanreport: Un informe es el resultado de un análisis de cumplimiento del clúster.
  management.cattle.io.feature: Las marcas de características permiten activar o desactivar ciertas características de {vendor}. Las características desactivadas por defecto deben considerarse funcionalidad experimental.
  cluster.x-k8s.io.machine: Un Machine encapsula la configuración de un Nodo de Kubernetes. Use esta vista para ver qué sucede después de actualizar un clúster.
  cluster.x-k8s.io.machinedeployment: Un Machine Deployment orquesta despliegues mediante plantillas sobre una colección de Machine Sets (similar a un Deployment). Use esta vista para ver qué sucede después de actualizar un clúster.
  cluster.x-k8s.io.machineset: Un Machine Set garantiza que el número deseado de recursos Machine estén en funcionamiento en todo momento (similar a un ReplicaSet). Use esta vista para ver qué sucede después de actualizar un clúster.
  resources.cattle.io.backup: Se crea una copia de seguridad para realizar copias únicas o programar copias recurrentes basadas en un ResourceSet.
  resources.cattle.io.restore: Se crea una restauración para activar una restauración en el clúster basada en un archivo de copia de seguridad.
  resources.cattle.io.resourceset: Un conjunto de recursos define qué CRDs y recursos almacenar en la copia de seguridad.
  monitoring.coreos.com.servicemonitor: Un monitor de servicio define el grupo de servicios y los endpoints que Prometheus recopilará para métricas. Esta es la forma más común de definir la recopilación de métricas.
  monitoring.coreos.com.podmonitor: Un monitor de pod define el grupo de pods que Prometheus recopilará para métricas. La forma común es usar monitores de servicio, pero los monitores de pod permiten manejar situaciones donde un monitor de servicio no funcionaría.
  monitoring.coreos.com.prometheusrule: Un recurso PrometheusRule define reglas de grabación y/o alertas. Una regla de grabación puede pre-calcular valores y guardar los resultados. Las reglas de alerta permiten definir condiciones para enviar notificaciones a AlertManager.
  monitoring.coreos.com.prometheus: Un servidor Prometheus es un despliegue de Prometheus cuya configuración de scrape y reglas son determinadas por ServiceMonitors, PodMonitors y PrometheusRules seleccionados, y cuyas alertas se enviarán a todos los Alertmanagers seleccionados.
  monitoring.coreos.com.alertmanager: Un administrador de alertas es un despliegue cuya configuración será especificada por un secreto en el mismo espacio de nombres, que determina qué alertas deben ir a qué receptor.
  node: El recurso base Nodo de Kubernetes representa una máquina virtual o física que aloja despliegues. Para gestionar el ciclo de vida de la máquina, si está disponible, vaya a Gestión de Clústeres.
  catalog.cattle.io.clusterrepo: 'Un repositorio de gráficos es un repositorio Helm o catálogo de aplicaciones basado en git de {vendor}. Proporciona la lista de gráficos disponibles en el clúster.'
  catalog.cattle.io.clusterrepo.local: ' Un repositorio de gráficos es un repositorio Helm o catálogo de aplicaciones basado en git de {vendor}. Proporciona la lista de gráficos disponibles en el clúster. Las plantillas de clúster se despliegan mediante gráficos Helm.'
  catalog.cattle.io.operation: Una operación es la lista de operaciones Helm recientes que se han aplicado al clúster.
  catalog.cattle.io.app: Una aplicación instalada es un gráfico Helm 3 que fue instalado mediante nuestros gráficos o a través de la CLI de Helm.
  logging.banzaicloud.io.clusterflow: Los registros del clúster se recopilarán y se enviarán a la Salida de Clúster seleccionada.
  logging.banzaicloud.io.clusteroutput: Una salida de clúster define qué proveedores de registro pueden recibir los registros y solo es efectiva cuando se despliega en el espacio de nombres donde está el operador de registro.
  logging.banzaicloud.io.flow: Un flujo define qué registros recopilar y filtrar, así como a qué salida enviarlos. El flujo es un recurso de espacio de nombres, lo que significa que solo se recopilarán registros del espacio de nombres donde se despliega.
  logging.banzaicloud.io.output: Una salida define qué proveedores de registro pueden recibir los registros. La salida debe estar en el mismo espacio de nombres que el flujo que la utiliza.
  group.principal: Asignar roles globales a un grupo solo funciona con proveedores de autenticación externos que admiten grupos. La autorización local no admite grupos.
  management.cattle.io.oidcclient: Aquí puede agregar aplicaciones al proveedor de identidad de inicio de sesión único de Rancher
  auditlog.cattle.io.auditpolicy: Defina reglas que determinen qué eventos de la API de Rancher se registran y el nivel de detalle que contienen.


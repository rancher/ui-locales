        recreate: "Recrear: Matar TODOS los pods, luego iniciar nuevos pods."
        rollingUpdate: "Actualización continua: Crear nuevos pods, hasta que se alcance el aumento máximo, antes de eliminar los pods antiguos. No detener más pods de los no disponibles máximos."
    terminationGracePeriodSeconds:
      label: Período de gracia de terminación
      tip: La duración que el pod necesita para terminar correctamente.
    title: Actualización
  tabs:
    labels:
      deployment: Despliegue
      pod: Pod
      containers: Contenedores


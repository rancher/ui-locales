    'ingress-ip-domain': 'Dominio DNS comodín para usar en nombres de host de Ingress generados automáticamente. Se añadirá <ingress-name>.<namespace-name>.<dirección IP del controlador de ingress> al dominio.'
    'server-url': 'URL de instalación predeterminada de {appName}. Debe ser HTTPS. Todos los nodos del clúster deben poder acceder a ella.'
    'system-default-registry': 'Registro privado para todas las imágenes de contenedores del sistema Rancher. Si no se especifica ningún valor, se usa el registro predeterminado para el tiempo de ejecución de contenedores.'
    'ui-index': 'Ubicación del índice HTML para la UI del Cluster Manager.'
    'ui-dashboard-index': 'Ubicación del índice HTML para la UI de {appName}.'
    'ui-offline-preferred': 'Controla si los activos de la UI se sirven localmente por el contenedor del servidor o desde la URL remota definida en la configuración ui-index y ui-dashboard-index.'
    'ui-pl': 'Nombre de empresa de etiqueta privada.'
    'auth-user-info-max-age-seconds': 'La antigüedad máxima de los tokens de autenticación de un usuario antes de que se realice una sincronización de membresía de grupo del proveedor de autenticación.'
    'auth-user-info-resync-cron': 'Horario cron predeterminado para resincronizar las membresías de grupos del proveedor de autenticación.'

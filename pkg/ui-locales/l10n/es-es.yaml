    'engine-install-url': 'URL de instalación predeterminada del motor Docker (para la mayoría de los controladores de nodo).'
    'engine-iso-url': 'URL de instalación predeterminada del SO (para el controlador de vSphere).'
    'engine-newest-version': 'La versión más reciente de Docker compatible en el momento de este lanzamiento. Una versión de Docker que no satisface el rango de Docker compatible pero es más reciente que esta se marcará como no probada.'
